app-id: one.mixin.messenger.desktop
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: mixin_desktop
rename-desktop-file: mixin_desktop.desktop
rename-icon: mixin_desktop
rename-appdata-file: mixin_desktop.metainfo.xml
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=PATH=/app/bin:/usr/bin

modules:
  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dbuild-date=false
      - -Dalsa=disabled
      - -Dlua=disabled
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/applications
      - /share/bash-completion
      - /share/doc
      - /share/icons
      - /share/man
      - /share/zsh
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209
    modules:
      - name: ffmpeg
        cleanup:
          - /include
          - /lib/pkgconfig
          - /share/ffmpeg/examples
        config-opts:
          - --enable-shared
          - --disable-static
          - --enable-gnutls
          - --enable-gpl
          - --disable-doc
          - --disable-programs
          - --disable-encoders
          - --disable-muxers
          - --enable-encoder=png
        sources:
          - type: archive
            url: https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz
            sha256: 464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c
      - name: libass
        cleanup:
          - /include
          - /lib/*.la
          - /lib/pkgconfig
        config-opts:
          - --disable-static
        sources:
          - type: archive
            url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
            sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc
      - name: uchardet
        buildsystem: cmake-ninja
        config-opts:
          - -DCMAKE_BUILD_TYPE=Release
          - -DBUILD_STATIC=0
          - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cleanup:
          - /bin
          - /include
          - /lib/cmake
          - /lib/pkgconfig
          - /share/man
        sources:
          - type: archive
            url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
            sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0
      - name: libplacebo
        buildsystem: meson
        cleanup:
          - /include
          - /lib/pkgconfig
        sources:
          - type: git
            url: https://github.com/haasn/libplacebo.git
            tag: v7.360.1
            commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: mixin_desktop
    buildsystem: simple
    build-commands:
      - mkdir -p /app/FlutterApp
      - tar -xf mixin_desktop_linux_portable.tar.gz -C /app/FlutterApp
      - chmod +x /app/FlutterApp/mixin_desktop
      - ln -s /app/FlutterApp/mixin_desktop /app/bin/mixin_desktop
      - install -Dm644 mixin_desktop.metainfo.xml /app/share/metainfo/mixin_desktop.metainfo.xml
      - install -Dm644 mixin_desktop.png /app/share/icons/hicolor/256x256/apps/mixin_desktop.png
      - install -Dm644 mixin_desktop.desktop /app/share/applications/mixin_desktop.desktop
    sources:
      - type: file
        path: mixin_desktop.desktop
      - type: file
        path: mixin_desktop.png
      - type: file
        path: mixin_desktop_linux_portable.tar.gz
      - type: file
        path: mixin_desktop.metainfo.xml
