# appimage-builder recipe see https://appimage-builder.readthedocs.io for details
version: 1
script:
  - rm -rf AppDir || true
  - cp -r build/linux/arm64/release/bundle AppDir
  - mkdir -p AppDir/usr/share/icons/hicolor/64x64/apps/
  - cp ./dist/deb/usr/share/icons/hicolor/128x128/apps/mixin_desktop.png AppDir/usr/share/icons/hicolor/64x64/apps/
AppDir:
  path: ./AppDir
  app_info:
    id: one.mixin.messenger
    name: Mixin Messenger
    icon: mixin_desktop
    version: latest
    exec: mixin_desktop
    exec_args: $@
  apt:
    arch: arm64
    allow_unauthenticated: true
    sources:
      - sourceline: deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble main restricted universe multiverse
      - sourceline: deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-updates main restricted universe multiverse
      - sourceline: deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-backports main restricted universe multiverse
      - sourceline: deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-security main restricted universe multiverse
    include:
      - libgtk-3-0t64
      - libwebkit2gtk-4.1-0
      # Bundle GTK input method clients, but keep the input method daemon on the host.
      - ibus-gtk3
      - fcitx5-frontend-gtk3
      - libsdl2-2.0-0
      - libopus0
      - libmpv2
    exclude:
      - humanity-icon-theme
      - hicolor-icon-theme
      - adwaita-icon-theme
      - ubuntu-mono
  files:
    exclude:
      - usr/share/man
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/NEWS.*
      - usr/share/doc/*/TODO.*
  after_bundle:
    # Package extraction does not run Debian's GTK cache trigger. AppRun v2 maps
    # the generated build-time AppDir paths to the runtime AppDir mount point.
    - LD_LIBRARY_PATH=AppDir/lib/aarch64-linux-gnu:AppDir/usr/lib/aarch64-linux-gnu AppDir/usr/lib/aarch64-linux-gnu/libgtk-3-0t64/gtk-query-immodules-3.0 AppDir/usr/lib/aarch64-linux-gnu/gtk-3.0/3.0.0/immodules/*.so > AppDir/usr/lib/aarch64-linux-gnu/gtk-3.0/3.0.0/immodules.cache
  runtime:
    env:
      GIO_MODULE_DIR: $APPDIR/usr/lib/aarch64-linux-gnu/gio/modules/
      GTK_PATH: $APPDIR/usr/lib/aarch64-linux-gnu/gtk-3.0
      GTK_IM_MODULE_FILE: $APPDIR/usr/lib/aarch64-linux-gnu/gtk-3.0/3.0.0/immodules.cache
      # Needed by Wayland
      GDK_BACKEND: x11
  test:
    fedora:
      image: appimagecrafters/tests-env:fedora-30
      command: ./AppRun
      use_host_x: true
    debian:
      image: appimagecrafters/tests-env:debian-stable
      command: ./AppRun
      use_host_x: true
    arch:
      image: appimagecrafters/tests-env:archlinux-latest
      command: ./AppRun
      use_host_x: true
    centos:
      image: appimagecrafters/tests-env:centos-7
      command: ./AppRun
      use_host_x: true
    ubuntu:
      image: appimagecrafters/tests-env:ubuntu-xenial
      command: ./AppRun
      use_host_x: true
AppImage:
  arch: aarch64
  update-information: guess
  sign-key: None
