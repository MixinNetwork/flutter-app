name: Update Test

# End-to-end tests of the in-app update, one job per platform, with a
# throwaway update key: no release secret is needed. One path list for all,
# so a change to the shared update code runs every platform.
#
# update-macos: builds 6.3.6 (601) and 6.3.7 (602) with Sparkle, ad-hoc
# signed, lets 6.3.6 update itself from a local appcast, and checks that 6.3.7
# runs (dist/test_update_macos.sh).
#
# update-windows: installs 6.3.6+601 with Inno Setup, lets it tap its update
# item and update itself to 6.3.7+602 from a local appcast, and checks that
# 6.3.7 runs.
#
# store-update: compiles the Store update channel and calls it from an
# installed MSIX. The package is sideloaded, so it is not associated with the
# Store: the check must give a Store error or 0, not crash. A real update is
# not tested.
on:
  pull_request:
    paths:
      - '.github/workflows/update-test.yml'
      - 'dist/macos_sign.sh'
      - 'dist/macos_sparkle.sh'
      - 'dist/test_update_macos.sh'
      - 'dist/update_appcast.py'
      - 'integration_test/app_update_e2e.dart'
      - 'integration_test/store_update_main.dart'
      - 'lib/ui/home/app_update_item.dart'
      - 'lib/ui/provider/app_update_provider.dart'
      - 'lib/utils/app_update.dart'
      - 'lib/widgets/select_item.dart'
      - 'macos/Runner/MainFlutterWindow.swift'
      - 'windows/runner/**'
      - 'windows_inno_setup.iss'
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "flutter version. eg 3.19.6"
        required: false
        default: ""

permissions:
  contents: read

env:
  FLUTTER_VERSION: ${{ github.event.inputs.flutter_version }}
  FLUTTER_CHANNEL: stable

jobs:
  update-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - run: touch .env

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Update 6.3.6 to 6.3.7 through Sparkle
        run: |
          # The system LibreSSL cannot make Ed25519 keys.
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          [ -x "$OPENSSL" ] || brew install openssl@3
          "$OPENSSL" version
          OPENSSL="$OPENSSL" ./dist/test_update_macos.sh

  update-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 'stable'
          override: true

      - uses: ilammy/setup-nasm@v1

      - run: git config --system core.longpaths true

      - name: Make a throwaway update key
        shell: bash
        run: |
          openssl version
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/update_key.pem"
          openssl pkey -in "$RUNNER_TEMP/update_key.pem" -pubout -outform DER \
            | tail -c 32 | base64 > assets/update_ed25519.pub
          touch .env

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build 6.3.7+602 (the update)
        run: |
          flutter build windows --build-name 6.3.7 --build-number 602
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" windows_inno_setup.iss
          New-Item -ItemType Directory served\v6.3.7 | Out-Null
          Move-Item build\mixin_desktop_windows_setup_amd64.exe served\v6.3.7\

      - name: Build 6.3.6+601 (installs the first update it finds)
        run: |
          flutter build windows -t integration_test/app_update_e2e.dart --build-name 6.3.6 --build-number 601
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" windows_inno_setup.iss
          Move-Item build\mixin_desktop_windows_setup_amd64.exe old_setup.exe

      - name: Write the test appcast
        shell: bash
        run: |
          python3 dist/update_appcast.py --tag v6.3.7 --build 602 \
            --key "$RUNNER_TEMP/update_key.pem" --public-key assets/update_ed25519.pub \
            --url-prefix http://127.0.0.1:8765/v6.3.7 --out served/appcast.xml \
            inno-x64=served/v6.3.7/mixin_desktop_windows_setup_amd64.exe
          cat served/appcast.xml

      - name: Install 6.3.6, let it update, check 6.3.7 runs
        env:
          # 6.3.6 and the 6.3.7 that its updater starts get this environment.
          MIXIN_UPDATE_APPCAST_URL: http://127.0.0.1:8765/appcast.xml
          # The old app taps its update item as soon as it shows.
          MIXIN_UPDATE_E2E_TAP: '1'
        run: |
          Start-Process python -ArgumentList '-m','http.server','8765','--directory','served'
          $exe = "$env:LOCALAPPDATA\Programs\Mixin\mixin_desktop.exe"
          # Not -Wait: it waits for all descendants, such as an app that Setup starts.
          $setup = Start-Process .\old_setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          $null = $setup.Handle
          $setup.WaitForExit()
          if ($setup.ExitCode -ne 0) { throw "old setup exit code $($setup.ExitCode)" }
          (Get-Item $exe).VersionInfo.ProductVersion
          Start-Sleep 5
          # Only the in-app updater passes /MIXINUPDATE=1, which starts the app.
          if (Get-Process mixin_desktop -ErrorAction SilentlyContinue) { throw 'a plain silent install started the app' }
          Start-Process $exe
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 5
            $version = (Get-Item $exe -ErrorAction SilentlyContinue).VersionInfo.ProductVersion
            $running = Get-Process mixin_desktop -ErrorAction SilentlyContinue | Where-Object Path -eq $exe
            Write-Output "$i version=$version running=$([bool]$running)"
            if ($version -like '6.3.7*' -and $running) {
              # Setup starts the app just before it exits and the updater deletes it.
              Start-Sleep 5
              if (Get-ChildItem $env:TEMP -Filter '.mixin_update_*' -Directory) { throw 'the download directory is left' }
              exit 0
            }
          }
          Get-ChildItem "$env:USERPROFILE\Documents\Mixin\log" -ErrorAction SilentlyContinue | Get-Content -Tail 50
          throw '6.3.7 is not installed and running'

  store-update:
    runs-on: windows-2022
    env:
      PUBLISHER: CN=272248D5-9A62-44D7-A299-5E1F8B46A9B0
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 'stable'
          override: true

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: git config --system core.longpaths true

      - run: flutter config --enable-windows-desktop

      # fix error when dump debug info: (msdia*.dll unregistered?)
      - run: regsvr32 "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\Remote Debugger\x64\msdia140.dll"

      - uses: ilammy/setup-nasm@v1

      - name: Build app with the test entry
        run: flutter build windows -t integration_test/store_update_main.dart

      - name: Create test certificate
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:PUBLISHER `
            -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = ConvertTo-SecureString -String test -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath test.pfx -Password $password
          Export-Certificate -Cert $cert -FilePath test.cer
          Import-Certificate -FilePath test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople

      # msix:create does not sign a store: true package and has no way to
      # turn the pubspec value off from the command line. Custom signtool
      # options replace its /tr timestamp server: the timestamp step failed
      # (0x80096005), and a self-signed test package does not need one.
      - name: Build msix
        run: |
          (Get-Content pubspec.yaml) -replace '^  store: true$', '  store: false' | Set-Content pubspec.yaml
          dart run msix:create --build-windows false --publisher $env:PUBLISHER --signtool-options '/v /fd SHA256 /f test.pfx /p test' --install-certificate false -v

      # Appx does not load in PowerShell 7.
      - name: Install and start
        shell: powershell
        run: |
          Add-AppxPackage -Path build\windows\x64\runner\Release\flutter_app.msix
          $package = Get-AppxPackage -Name 14801MixinLtd.MixinDesktop
          $app = (Get-AppxPackageManifest $package).Package.Applications.Application.Id
          $result = "$env:USERPROFILE\store_update_result.txt"
          Start-Process "shell:AppsFolder\$($package.PackageFamilyName)!$app"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $result); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $result)) { Write-Error "no result: the app did not start or crashed"; exit 1 }
          $text = Get-Content $result
          echo "storeUpdateCount: $text"
          # null means the native side found no package identity.
          if ($text -ne 'count 0' -and $text -notlike 'error PlatformException(store_error*') { exit 1 }
